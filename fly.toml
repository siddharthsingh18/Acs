# Fly.io Public Demo Deployment Configuration for ACS (Automated CCTV Accident Detection System)
app = "acs-cctv-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  DEMO_MODE = "true"
  PUBLIC_DEMO = "true"
  ALERTS_DRY_RUN = "true"
  ALERTS_ENABLED = "false"
  STORE_UPLOADS = "false"
  CAMERA_WORKER_DEVICE = "cpu"
  DEVICE = "cpu"
  MODEL_PATH = "best.pt"
  STRICT_SECRETS = "false"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
