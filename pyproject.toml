[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "legacy",
    "temp",
    "report_images",
    "reports",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
