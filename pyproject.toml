[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "legacy",
    "temp",
    "report_images",
    "reports",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length
    "E402",  # Module level import not at top of file (sys.path customization)
    "E741",  # Ambiguous variable name
    "F841",  # Unused local variable
    "W291",  # Trailing whitespace
    "W293",  # Blank line whitespace
    "E712",  # Comparison to True/False in SQLModel expressions
]
