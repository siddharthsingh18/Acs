name: Nightly Incident Regression Evaluation

on:
  schedule:
    # Runs every night at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_fa_per_hour:
        description: "Ceiling False Alarm rate per hour threshold"
        required: false
        default: "0.25"
      model:
        description: "Model checkpoint to evaluate"
        required: false
        default: "best.pt"

jobs:
  nightly-regression-gate:
    name: Incident-Level Quality Gate (Holdout Clips)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Incident-Level Regression Evaluation on Frozen Test Clips
        id: run-eval
        run: |
          python ml/scripts/eval_nightly_regression.py \
            --model "${{ github.event.inputs.model || 'best.pt' }}" \
            --test-dir "ml/data/video_eval/test" \
            --max-fa-per-hour "${{ github.event.inputs.max_fa_per_hour || '0.25' }}" \
            --device "cpu" \
            --output-summary "$GITHUB_STEP_SUMMARY"
        env:
          MLFLOW_DISABLED: "false"

      - name: Upload Nightly Regression Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-report
          path: reports/nightly_regression_report.md
          retention-days: 30
